name: Docker Image CI (Runner)

on:
  push:
    branches: ["main"]
    paths:
      - '/runner/*'
  workflow_dispatch:
    
permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: self-hosted
    strategy:
      matrix:
        include:
          - os_name: "ubuntu-24.04"
            base_image: "ubuntu:24.04"
            tag: "ubuntu-24.04"
          - os_name: "debian-latest"
            base_image: "debian:latest"
            tag: "debian-latest"
          - os_name: "ubuntu-latest"
            base_image: "ubuntu:latest"
            tag: "ubuntu-latest"
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v7
    
    - name: Login to GitHub Container Registry
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Read version from file
      id: get_version
      run: |
        VERSION=$(cat ./runner/VERSION)
        echo "version=$VERSION" >> $GITHUB_OUTPUT
    
    - name: Docker metadata
      id: meta
      uses: docker/metadata-action@v6
      with:
        images: ghcr.io/l1p0-m/github-runner-docker
        tags: |
          type=raw,value=${{ matrix.tag }}
          type=raw,value=${{ matrix.tag }}-${{ steps.get_version.outputs.version }}
          type=raw,value=${{ matrix.tag }}-${{ steps.get_version.outputs.version }}-${{ github.sha }}


    - name: Build and push
      uses: docker/build-push-action@v7
      with:
        context: ./runner
        file: ./runner/dockerfile
        platforms: linux/amd64,linux/arm64
        build-args: |
          BASE_IMAGE=${{ matrix.base_image }}
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
